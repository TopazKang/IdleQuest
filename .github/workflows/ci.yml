name: Pull request delivery

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: idlequest-pr-deploy
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate:content
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ""

  image:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    needs: verify
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve immutable image name
        id: meta
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            tag="pr-${{ github.event.pull_request.number }}-${GITHUB_SHA}"
          else
            tag="main-${GITHUB_SHA}"
          fi
          echo "image=${REGISTRY}/${repository}:${tag}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}
          build-args: NEXT_PUBLIC_BASE_PATH=
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux]
    needs: image
    environment:
      name: preview
      url: https://quest.topazkang.com
    steps:
      - uses: actions/checkout@v4
      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull and deploy with Compose
        env:
          IDLEQUEST_IMAGE: ${{ needs.image.outputs.image }}
        run: |
          docker compose pull
          docker compose up -d --remove-orphans
          docker image prune -f
      - name: Verify local endpoint
        env:
          IDLEQUEST_IMAGE: ${{ needs.image.outputs.image }}
        run: |
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:6745/ >/dev/null; then
              exit 0
            fi
            sleep 3
          done
          docker compose logs --tail=100
          exit 1
